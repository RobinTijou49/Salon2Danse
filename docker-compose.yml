services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web

  api:
    build: ./api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://salon:${DB_PASSWORD:-salon}@db:3306/salon
      JWT_SECRET: ${JWT_SECRET:-change-me}
      QR_SIGNING_SECRET: ${QR_SIGNING_SECRET:-change-me}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minio}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio12345}
      S3_BUCKET: photos
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      - api

  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: salon
      MARIADB_USER: salon
      MARIADB_PASSWORD: ${DB_PASSWORD:-salon}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsalon}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio12345}
    volumes:
      - minio_data:/data
    ports:
      - "9001:9001"

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"

  # Interface web de la base de données (dev). Retirer ou protéger avant l'événement réel.
  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"

volumes:
  db_data:
  minio_data:
  caddy_data:
  caddy_config:
